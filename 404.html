<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Ahmet Anıl Demirhan</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") d.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <!-- Served for any missing path, so links are root-relative. -->
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="/">Ahmet Anıl Demirhan<span>.</span></a>
  </div>
</nav>
<main class="notfound">
  <div class="wrap">
    <div class="code">404</div>
    <h1 class="serif" style="font-size:clamp(32px,4vw,48px)" id="t">This scene didn't make the final cut.</h1>
    <p id="d">The page you're looking for doesn't exist or has moved.</p>
    <a class="btn primary" href="/" id="b">Back to the homepage</a>
  </div>
</main>
<script>
  // Match the visitor's chosen language without loading the full site script.
  var lang = null;
  try { lang = localStorage.getItem("lang"); } catch (e) {}
  if ((lang || navigator.language || "").toLowerCase().indexOf("tr") === 0) {
    document.documentElement.lang = "tr";
    document.getElementById("t").textContent = "Bu sahne son kurguya giremedi.";
    document.getElementById("d").textContent = "Aradığın sayfa yok ya da taşınmış.";
    document.getElementById("b").textContent = "Ana sayfaya dön";
  }
</script>
</body>
</html>
